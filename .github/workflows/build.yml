name: Build N Buggy bench test
on: [push, workflow_dispatch]
jobs:
 android:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
     with:
      packages: platform-tools
   - run: yes | sdkmanager --licenses >/dev/null
   - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.9'
   - run: gradle -p android assembleDebug
   - uses: actions/upload-artifact@v4
     with:
      name: N-Buggy-Test-APK
      path: android/app/build/outputs/apk/debug/*.apk
 firmware:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: arduino/setup-arduino-cli@v2
   - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
   - run: arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
   - run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/NBuggyTest
